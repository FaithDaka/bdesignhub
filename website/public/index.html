    <!-- Inline CSS for Instant Loading State -->
    <style>
      /* Reset and base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #ffffff;
        color: #1a1a1a;
      }

      /* Loading spinner that shows immediately */
      #root:empty::after {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        border: 4px solid #f0f0f0;
        border-top: 4px solid #244d53;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      /* Loading text */
      #root:empty::before {
        content: 'Loading B Design Hub...';
        position: fixed;
        top: calc(50% + 50px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 15px;
        color: #777;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      /* NoScript fallback styles */
      .noscript-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
        background: linear-gradient(135deg, #e6e6e6 0%, #fdf8ff 18%, #fff 22%, #fdfdfd 60%, #f9edfe 100%);
        color: white;
      }

      .noscript-fallback h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        font-weight: 700;
      }

      .noscript-fallback h2 {
        font-size: 1.5rem;
        margin-bottom: 2rem;
        font-weight: 400;
        opacity: 0.9;
      }

      .noscript-fallback p {
        font-size: 1.1rem;
        margin-bottom: 1rem;
        max-width: 600px;
        line-height: 1.6;
      }

      .noscript-fallback a {
        color: white;
        text-decoration: underline;
        font-weight: 600;
        margin: 0 10px;
        transition: opacity 0.2s;
      }

      .noscript-fallback a:hover {
        opacity: 0.8;
      }

      .noscript-links {
        display: flex;
        gap: 20px;
        margin-top: 2rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .noscript-fallback strong {
        font-size: 1.2rem;
        display: block;
        margin-top: 2rem;
      }
    </style>
